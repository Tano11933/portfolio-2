<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ggGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#536878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C93A3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="#0A0A0A"/>
  
  <!-- GG Text -->
  <text 
    x="128" 
    y="170" 
    font-family="'Clash Display', system-ui, sans-serif" 
    font-size="140" 
    font-weight="600" 
    text-anchor="middle" 
